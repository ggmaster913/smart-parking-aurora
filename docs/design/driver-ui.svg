<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'PT Sans', 'Open Sans', Arial, sans-serif">
  <title>Умная парковка #19 — макет: карта с карточкой зоны и активная парковка (не снимок устройства)</title>
  <!-- МАКЕТ для #19. Цвета приближённые: на устройстве их задают Theme и атмосфера. MIT. -->
  <rect width="820" height="760" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">МАКЕТ #19 · не снимок эмулятора · тёмная схема</text>

  <!-- ===== 1. Карта + карточка ===== -->
  <g transform="translate(20,50)">
    <rect width="380" height="690" rx="26" fill="#17191d"/>
    <text x="22" y="40" font-size="22" fill="#e8eaed">Парковки рядом</text>
    <text x="22" y="62" font-size="13" fill="#9aa0a6">Демо-местоположение</text>
    <!-- карта -->
    <rect x="0" y="78" width="380" height="612" fill="#2a2e35"/>
    <path d="M0 200 L380 160 M0 330 L380 380 M120 78 L160 690 M280 78 L240 690" stroke="#3a3f47" stroke-width="10"/>
    <circle cx="150" cy="250" r="9" fill="#45c3d6"/><circle cx="260" cy="210" r="9" fill="#45c3d6"/>
    <circle cx="205" cy="300" r="14" fill="#45c3d6" stroke="#ffffff" stroke-width="3"/>
    <circle cx="100" cy="360" r="9" fill="#6b7078"/>
    <!-- карточка -->
    <rect x="12" y="378" width="356" height="272" rx="14" fill="#1f2228" fill-opacity="0.96" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="32" y="414" font-size="22" fill="#d8f3f7">Демо-парковка Центр</text>
    <text x="345" y="414" text-anchor="end" font-size="20" fill="#9aa0a6">✕</text>
    <text x="32" y="440" font-size="14" fill="#a7c9cf">Демонстрационный адрес 1, длинный адрес</text>
    <text x="32" y="458" font-size="14" fill="#a7c9cf">переносится на вторую строку</text>
    <text x="32" y="502" font-size="34" fill="#45c3d6">180 ₽ / ч</text>
    <text x="348" y="502" text-anchor="end" font-size="14" fill="#a7c9cf">350 м по прямой</text>
    <text x="32" y="534" font-size="17" fill="#45c3d6">Свободно 12 из 40</text>
    <text x="32" y="556" font-size="12" fill="#a7c9cf">Круглосуточно</text>
    <rect x="70" y="578" width="240" height="50" rx="25" fill="#ffffff" fill-opacity="0.14"/>
    <text x="190" y="610" text-anchor="middle" font-size="18" fill="#ffffff">Выбрать место</text>
    <rect x="232" y="660" width="140" height="20" fill="#ffffff" fill-opacity="0.8"/>
    <text x="366" y="675" text-anchor="end" font-size="11" fill="#202124">© участники OpenStreetMap</text>
    <text x="20" y="720" font-size="12" fill="#5f6368">Появление: opacity + сдвиг 200 мс; смена зоны: scale 1,02 за 150 мс</text>
  </g>

  <!-- ===== 2. Активная парковка ===== -->
  <g transform="translate(420,50)">
    <rect width="380" height="690" rx="26" fill="#17191d"/>
    <text x="358" y="40" text-anchor="end" font-size="22" fill="#e8eaed">Парковка</text>
    <!-- обычное состояние -->
    <text x="22" y="86" font-size="17" fill="#45c3d6">Идёт парковка</text>
    <text x="22" y="148" font-size="56" fill="#45c3d6">1:04:59</text>
    <rect x="22" y="164" width="336" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="22" y="164" width="243" height="6" rx="3" fill="#45c3d6"/>
    <text x="22" y="194" font-size="14" fill="#a7c9cf">до 23:45</text>
    <text x="22" y="230" font-size="12" fill="#9aa0a6">Автомобиль</text>
    <text x="22" y="252" font-size="17" fill="#d8f3f7">А123ВС77</text>
    <text x="22" y="282" font-size="12" fill="#9aa0a6">Парковка и место</text>
    <text x="22" y="304" font-size="17" fill="#d8f3f7">Демо-парковка Центр, место 01</text>
    <text x="22" y="340" font-size="17" fill="#ffffff">Показать зону на карте</text>
    <text x="22" y="376" font-size="12" fill="#9aa0a6">Оплачено всего (демо)</text>
    <text x="22" y="398" font-size="17" fill="#45c3d6">135 ₽</text>
    <rect x="70" y="420" width="240" height="50" rx="25" fill="#ffffff" fill-opacity="0.14"/>
    <text x="190" y="452" text-anchor="middle" font-size="18" fill="#ffffff">Продлить (демо)</text>
    <!-- янтарное состояние -->
    <line x1="22" y1="500" x2="358" y2="500" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="22" y="530" font-size="13" fill="#9aa0a6">То же при остатке меньше 15 минут:</text>
    <text x="22" y="560" font-size="17" fill="#e0a030">Осталось меньше 15 минут</text>
    <text x="22" y="614" font-size="56" fill="#e0a030">08:12</text>
    <rect x="22" y="630" width="336" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="22" y="630" width="30" height="6" rx="3" fill="#e0a030"/>
    <text x="22" y="664" font-size="12" fill="#9aa0a6">Истекло: красный «Время истекло», 0:00, «Найти парковку»</text>
    <text x="20" y="720" font-size="12" fill="#5f6368">Шкала: тот же секундный таймер, плавное изменение 250 мс</text>
  </g>
</svg>
