<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" font-family="'PT Sans', 'Open Sans', Arial, sans-serif">
  <title>Умная парковка — макет карточки зоны и активной парковки (не снимок устройства)</title>
  <!-- МАКЕТ для docs/DESIGN.md. Цвета приближённые: на устройстве их задаёт Theme и атмосфера. MIT. -->
  <rect width="800" height="1000" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#202124">МАКЕТ · не снимок эмулятора</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5f6368">Слева тёмная схема (Theme.LightOnDark), справа светлая (Theme.DarkOnLight)</text>

  <!-- ===== Тёмная схема ===== -->
  <g transform="translate(20,80)">
    <rect width="370" height="900" rx="28" fill="#1b1e24"/>
    <!-- карточка зоны -->
    <text x="24" y="44" font-size="15" fill="#9aa0a6">Карточка зоны (qml/parking, Илья)</text>
    <rect x="16" y="60" width="338" height="300" rx="14" fill="#45c3d6" fill-opacity="0.12"/>
    <text x="36" y="102" font-size="24" fill="#d8f3f7">Демо-парковка Центр</text>
    <text x="36" y="130" font-size="15" fill="#a7c9cf">Демонстрационный адрес 1,</text>
    <text x="36" y="150" font-size="15" fill="#a7c9cf">длинное название переносится</text>
    <text x="36" y="190" font-size="19" fill="#45c3d6">180 ₽ / час</text>
    <text x="160" y="190" font-size="15" fill="#a7c9cf">· 350 м по прямой</text>
    <text x="36" y="222" font-size="17" fill="#45c3d6">Свободно 12 из 40</text>
    <text x="36" y="248" font-size="14" fill="#a7c9cf">Круглосуточно</text>
    <rect x="65" y="282" width="240" height="52" rx="26" fill="#ffffff" fill-opacity="0.14"/>
    <text x="185" y="315" text-anchor="middle" font-size="18" fill="#ffffff">Выбрать место</text>

    <!-- активная парковка -->
    <text x="24" y="410" font-size="15" fill="#9aa0a6">Активная парковка (qml/booking, #5)</text>
    <text x="340" y="446" text-anchor="end" font-size="20" fill="#ffffff">Парковка</text>
    <text x="24" y="490" font-size="17" fill="#45c3d6">Идёт парковка</text>
    <text x="24" y="524" font-size="14" fill="#a7c9cf">Осталось</text>
    <text x="24" y="592" font-size="64" fill="#45c3d6">1:04:59</text>
    <text x="24" y="624" font-size="15" fill="#a7c9cf">до 23:45</text>
    <text x="24" y="666" font-size="17" fill="#d8f3f7">А123ВС77 · место 01</text>
    <text x="24" y="692" font-size="15" fill="#a7c9cf">Демо-парковка Центр</text>
    <text x="24" y="718" font-size="15" fill="#a7c9cf">Оплачено 135 ₽ (демо)</text>
    <rect x="65" y="752" width="240" height="52" rx="26" fill="#ffffff" fill-opacity="0.14"/>
    <text x="185" y="785" text-anchor="middle" font-size="18" fill="#ffffff">Продлить</text>
    <text x="185" y="840" text-anchor="middle" font-size="12" fill="#9aa0a6">ДЕМО: оплата симулируется, данные карты не нужны</text>
  </g>

  <!-- ===== Светлая схема ===== -->
  <g transform="translate(410,80)">
    <rect width="370" height="900" rx="28" fill="#f2f3f5" stroke="#dadce0"/>
    <text x="24" y="44" font-size="15" fill="#5f6368">Карточка зоны, мест мало</text>
    <rect x="16" y="60" width="338" height="300" rx="14" fill="#0e7486" fill-opacity="0.10"/>
    <text x="36" y="102" font-size="24" fill="#0b4f5c">Демо-парковка Север</text>
    <text x="36" y="130" font-size="15" fill="#4a6c73">Демонстрационный адрес 5</text>
    <text x="36" y="190" font-size="19" fill="#0e7486">Бесплатно</text>
    <text x="36" y="222" font-size="17" fill="#0b4f5c">Осталось 2 места</text>
    <text x="36" y="248" font-size="14" fill="#4a6c73">08:00–22:00</text>
    <rect x="65" y="282" width="240" height="52" rx="26" fill="#000000" fill-opacity="0.08"/>
    <text x="185" y="315" text-anchor="middle" font-size="18" fill="#1a1c20">Выбрать место</text>

    <text x="24" y="410" font-size="15" fill="#5f6368">Активная парковка, время вышло</text>
    <text x="340" y="446" text-anchor="end" font-size="20" fill="#1a1c20">Парковка</text>
    <text x="24" y="490" font-size="17" fill="#4a6c73">Время истекло</text>
    <text x="24" y="524" font-size="14" fill="#4a6c73">Осталось</text>
    <text x="24" y="592" font-size="64" fill="#4a6c73">0:00</text>
    <text x="24" y="624" font-size="15" fill="#4a6c73">закончилась в 23:45</text>
    <text x="24" y="666" font-size="17" fill="#0b4f5c">А123ВС77 · место 01</text>
    <text x="24" y="692" font-size="15" fill="#4a6c73">Демо-парковка Центр</text>
    <text x="24" y="718" font-size="15" fill="#4a6c73">Оплачено 135 ₽ (демо)</text>
    <rect x="65" y="752" width="240" height="52" rx="26" fill="#000000" fill-opacity="0.08"/>
    <text x="185" y="785" text-anchor="middle" font-size="18" fill="#1a1c20">Найти парковку</text>
    <text x="185" y="840" text-anchor="middle" font-size="12" fill="#5f6368">Цвет статуса всегда дублируется подписью</text>
  </g>
</svg>
